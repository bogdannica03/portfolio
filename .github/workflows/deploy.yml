name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify repository
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          find . -maxdepth 2 -type f | sort

          echo "Vite config:"
          cat vite.config.ts

          echo "Package:"
          cat package.json

      - name: Install dependencies
        run: npm ci

      - name: Build TanStack Start
        run: npm run build

      - name: Verify build output
        run: |
          echo "---- .output ----"
          find .output -maxdepth 3 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static output
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4